<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wer_sonst13 — Justin</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0e0e10;
      --surface: #161618;
      --border: #222226;
      --text: #ececec;
      --sub: #666668;
      --dim: #333336;
      --green: #3ddc84;
    }

    body {
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      color: var(--text);
      overflow-x: hidden;
      background: #0b0b0c;
    }

    /* ===== Animated Background ===== */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;

      background:
        radial-gradient(circle at 20% 30%, rgba(61,220,132,0.12), transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(88,101,242,0.12), transparent 40%),
        radial-gradient(circle at 50% 50%, rgba(255,255,255,0.04), transparent 60%);

      animation: moveBg 18s ease-in-out infinite alternate;
    }

    @keyframes moveBg {
      0% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(-30px, 20px) scale(1.05); }
      100% { transform: translate(30px, -20px) scale(1.08); }
    }

    /* ===== Cursor Glow ===== */
    #cursor-glow {
      position: fixed;
      width: 300px;
      height: 300px;
      pointer-events: none;
      border-radius: 50%;
      z-index: 0;

      background: radial-gradient(circle, rgba(61,220,132,0.18), rgba(88,101,242,0.12), transparent 70%);
      filter: blur(60px);

      transform: translate(-50%, -50%);
      transition: transform 0.08s ease-out;
    }

    .wrap {
      max-width: 640px;
      margin: 0 auto;
      padding: 0 24px 120px;
      position: relative;
      z-index: 1;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 36px 0;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 9px;
      cursor: pointer;
      text-decoration: none;
    }

    .logo-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--green);
    }

    .logo-text {
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      color: var(--text);
    }

    .nav-links {
      display: flex;
      gap: 2px;
      list-style: none;
    }

    .nav-links button {
      background: none;
      border: none;
      color: var(--sub);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    .nav-links button:hover { color: var(--text); }
    .nav-links button.active { color: var(--text); }

    section { display: none; }
    section.active { display: block; }

    .home { padding: 80px 0 0; }

    .tag {
      font-size: 11px;
      color: var(--green);
      margin-bottom: 28px;
    }

    h1 {
      font-size: 52px;
      margin-bottom: 22px;
    }

    h1 em { color: var(--sub); }

    .intro {
      font-size: 15px;
      color: var(--sub);
      margin-bottom: 40px;
    }

    .btn-primary {
      background: var(--text);
      color: var(--bg);
      padding: 10px 20px;
      border-radius: 7px;
      cursor: pointer;
      border: none;
    }

    footer {
      margin-top: 80px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>

<body>

<div id="cursor-glow"></div>

<div class="wrap">

  <nav>
    <a class="logo" onclick="show('home')">
      <div class="logo-dot"></div>
      <span class="logo-text">Wer_sonst13</span>
    </a>
    <ul class="nav-links">
      <li><button id="nav-home" class="active" onclick="show('home')">Start</button></li>
      <li><button id="nav-about" onclick="show('about')">Über mich</button></li>
      <li><button id="nav-contact" onclick="show('contact')">Kontakt</button></li>
    </ul>
  </nav>

  <section id="home" class="active">
    <div class="home">
      <p class="tag">Willkommen</p>
      <h1>Hey, ich bin<br><em>Justin.</em></h1>
      <p class="intro">Ich bin ein Programmierer für Minecraft Server.</p>
      <button class="btn-primary" onclick="show('contact')">Kontakt</button>
    </div>
  </section>

  <section id="about">
    <h1>Über mich</h1>
    <p>Ich mache Plugins und Server Setups.</p>
  </section>

  <section id="contact">
    <h1>Kontakt</h1>
    <p>Discord: Wer_sonst13</p>
  </section>

  <footer>
    <span>Wer_sonst13</span>
    <span>© 2026</span>
  </footer>

</div>

<script>
function show(id) {
  document.querySelectorAll('section').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* Cursor Glow */
const glow = document.getElementById("cursor-glow");

document.addEventListener("mousemove", (e) => {
  glow.style.left = e.clientX + "px";
  glow.style.top = e.clientY + "px";
});
</script>

</body>
</html>
