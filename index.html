<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wer_sonst13 — Justin</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
* { margin:0; padding:0; box-sizing:border-box; }

:root {
  --bg:#0b0b0c;
  --text:#ececec;
  --sub:#888;
  --border:#222226;
  --green:#3ddc84;
}

body {
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--text);
  overflow-x:hidden;
}

/* Background */
body::before {
  content:"";
  position:fixed;
  inset:0;
  z-index:0;
  background:
    radial-gradient(circle at 20% 30%, rgba(61,220,132,0.12), transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(88,101,242,0.12), transparent 40%);
  filter: blur(20px);
}

/* Layout */
.wrap {
  max-width:640px;
  margin:auto;
  padding:0 24px 120px;
  position:relative;
  z-index:1;
  overflow:hidden;
}

nav {
  display:flex;
  justify-content:space-between;
  padding:30px 0;
}

.logo {
  display:flex;
  gap:8px;
  cursor:pointer;
}

.logo-dot {
  width:8px;height:8px;
  background:var(--green);
  border-radius:50%;
}

.nav-links button {
  background:none;
  border:none;
  color:var(--sub);
  margin-left:10px;
  cursor:pointer;
}

.nav-links button.active {
  color:var(--green);
}

/* ===== APP SLIDE ANIMATION ===== */
section {
  position:absolute;
  inset:0;
  opacity:0;
  transform:translateX(100%);
  pointer-events:none;
  transition:all .45s cubic-bezier(.22,1,.36,1);
}

section.active {
  opacity:1;
  transform:translateX(0);
  pointer-events:auto;
  z-index:2;
}

section.exit-left {
  transform:translateX(-100%);
  opacity:0;
}

section.exit-right {
  transform:translateX(100%);
  opacity:0;
}

section.enter-left {
  transform:translateX(-100%);
}

section.enter-right {
  transform:translateX(100%);
}

/* Text */
.tag { color:var(--green); font-size:12px; }
h1 { font-size:48px; margin:10px 0; }
h2 { font-size:28px; margin:10px 0; }
.intro { color:var(--sub); margin-bottom:20px; }

/* Button */
.btn {
  background:#fff;
  color:#000;
  padding:10px 16px;
  border-radius:8px;
  cursor:pointer;
  border:none;
}

/* Contact */
.dc {
  display:flex;
  justify-content:space-between;
  padding:14px;
  border:1px solid var(--border);
  border-radius:12px;
}

.dc a {
  background:#5865F2;
  padding:8px 12px;
  color:#fff;
  border-radius:8px;
  text-decoration:none;
}
</style>
</head>

<body>

<div class="wrap">

<nav>
  <div class="logo" onclick="show('home')">
    <div class="logo-dot"></div>
    Wer_sonst13
  </div>

  <div class="nav-links">
    <button id="nav-home" class="active" onclick="show('home')">Start</button>
    <button id="nav-about" onclick="show('about')">Über mich</button>
    <button id="nav-contact" onclick="show('contact')">Kontakt</button>
  </div>
</nav>

<!-- HOME -->
<section id="home" class="active">
  <p class="tag">Willkommen</p>
  <h1>Hey, ich bin Justin</h1>
  <p class="intro">Minecraft Dev & Programmer</p>
  <button class="btn" onclick="show('contact')">Kontakt</button>
</section>

<!-- ABOUT -->
<section id="about">
  <p class="tag">Über mich</p>
  <h2>Programmierung</h2>
  <p class="intro">Plugins, Server, Configs</p>
</section>

<!-- CONTACT -->
<section id="contact">
  <p class="tag">Kontakt</p>
  <h2>Schreib mir</h2>

  <div class="dc">
    <div>
      <strong>Wer_sonst13</strong><br>
      <span style="color:var(--sub);font-size:13px;">Discord</span>
    </div>

    <a href="https://discord.com/users/Wer_sonst13" target="_blank">
      DM →
    </a>
  </div>
</section>

</div>

<script>
let current = "home";
const order = ["home","about","contact"];

function show(id) {
  if (id === current) return;

  const currentEl = document.getElementById(current);
  const nextEl = document.getElementById(id);

  const currentIndex = order.indexOf(current);
  const nextIndex = order.indexOf(id);

  const direction = nextIndex > currentIndex ? "right" : "left";

  nextEl.classList.remove("enter-left","enter-right");
  nextEl.classList.add(direction === "right" ? "enter-right" : "enter-left");

  nextEl.offsetHeight;

  nextEl.classList.add("active");
  nextEl.classList.remove(direction === "right" ? "enter-right" : "enter-left");

  currentEl.classList.add(direction === "right" ? "exit-left" : "exit-right");
  currentEl.classList.remove("active");

  setTimeout(()=>{
    currentEl.classList.remove("exit-left","exit-right");
  },450);

  document.querySelectorAll('.nav-links button').forEach(b=>b.classList.remove('active'));
  document.getElementById('nav-'+id).classList.add('active');

  current = id;
}
</script>

</body>
</html>
