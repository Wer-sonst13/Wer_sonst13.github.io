<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wer_sonst13 — Justin</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
* { margin:0; padding:0; box-sizing:border-box; }

:root {
  --bg:#0b0b0c;
  --text:#ececec;
  --sub:#888;
  --border:#222226;
  --green:#3ddc84;
}

body {
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.6;
  overflow-x:hidden;
}

/* ===== Background ===== */
body::before {
  content:"";
  position:fixed;
  inset:0;
  z-index:0;
  background:
    radial-gradient(circle at 20% 30%, rgba(61,220,132,0.12), transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(88,101,242,0.12), transparent 40%),
    radial-gradient(circle at 50% 50%, rgba(255,255,255,0.04), transparent 60%);
  filter: blur(20px);
  opacity:0.7;
  animation: move 18s ease-in-out infinite alternate;
}

@keyframes move {
  0% { transform:translate(0,0) scale(1); }
  50% { transform:translate(-30px,20px) scale(1.05); }
  100% { transform:translate(30px,-20px) scale(1.08); }
}

/* ===== Layout ===== */
.wrap {
  max-width:640px;
  margin:auto;
  padding:0 24px 120px;
  position:relative;
  z-index:1;
  overflow:hidden;
}

nav {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:36px 0;
}

.logo {
  display:flex;
  gap:8px;
  align-items:center;
  cursor:pointer;
}

.logo-dot {
  width:8px;height:8px;
  border-radius:50%;
  background:var(--green);
}

.logo-text {
  font-family:'JetBrains Mono';
  font-size:14px;
}

.nav-links {
  display:flex;
  gap:6px;
}

.nav-links button {
  background:transparent;
  border:1px solid transparent;
  color:var(--sub);
  padding:8px 14px;
  border-radius:8px;
  cursor:pointer;
  transition:.2s;
}

.nav-links button:hover {
  color:var(--text);
  border-color:var(--border);
  background:rgba(255,255,255,0.03);
}

.nav-links button.active {
  color:var(--green);
  border-color:rgba(61,220,132,0.25);
  background:rgba(61,220,132,0.08);
}

/* ===== NEW PAGE ANIMATION ===== */
section {
  position:absolute;
  inset:0;
  opacity:0;
  transform:translateY(40px) scale(0.97);
  pointer-events:none;
  transition:all .5s cubic-bezier(.22,1,.36,1);
}

section.active {
  opacity:1;
  transform:translateY(0) scale(1);
  pointer-events:auto;
  z-index:2;
}

section.exit {
  opacity:0;
  transform:translateY(-40px) scale(0.97);
  z-index:1;
}

/* ===== Text ===== */
.tag {
  font-size:11px;
  color:var(--green);
  margin-bottom:20px;
}

h1 {
  font-size:clamp(40px,5vw,56px);
  line-height:1.1;
  margin-bottom:18px;
}

h1 em { color:var(--sub); }

h2 {
  font-size:clamp(26px,3vw,34px);
  margin-bottom:16px;
}

.intro {
  color:var(--sub);
  max-width:60ch;
  margin-bottom:30px;
}

/* ===== Buttons ===== */
.btn-primary {
  background:var(--text);
  color:#000;
  padding:11px 18px;
  border-radius:10px;
  border:none;
  cursor:pointer;
  font-weight:500;
}

.btn-line {
  background:transparent;
  border:1px solid var(--border);
  color:var(--text);
  padding:11px 18px;
  border-radius:10px;
  margin-left:10px;
  cursor:pointer;
}

/* ===== Stats ===== */
.stats {
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-top:40px;
}

.stat {
  background:rgba(255,255,255,0.03);
  border:1px solid var(--border);
  padding:14px;
  border-radius:12px;
  text-align:center;
}

/* ===== Chips ===== */
.chips {
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:20px;
}

.chip {
  font-size:12px;
  padding:6px 10px;
  border-radius:999px;
  border:1px solid var(--border);
  color:var(--sub);
}

/* ===== Contact ===== */
.dc-block {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px;
  border-radius:14px;
  border:1px solid var(--border);
  background:rgba(255,255,255,0.02);
  margin-top:20px;
}

.dc-cta {
  background:#5865F2;
  padding:10px 14px;
  border-radius:10px;
  color:#fff;
  text-decoration:none;
  font-size:13px;
}

/* ===== Footer ===== */
footer {
  margin-top:80px;
  padding-top:20px;
  border-top:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  color:var(--sub);
  font-size:13px;
}

/* ===== Scroll Animation ===== */
.reveal {
  opacity:0;
  transform:translateY(20px);
  transition:all .7s ease;
}

.reveal.active {
  opacity:1;
  transform:translateY(0);
}
</style>
</head>

<body>

<div class="wrap">

<nav>
  <div class="logo" onclick="show('home')">
    <div class="logo-dot"></div>
    <div class="logo-text">Wer_sonst13</div>
  </div>

  <div class="nav-links">
    <button id="nav-home" class="active" onclick="show('home')">Start</button>
    <button id="nav-about" onclick="show('about')">Über mich</button>
    <button id="nav-contact" onclick="show('contact')">Kontakt</button>
  </div>
</nav>

<section id="home" class="active">
  <p class="tag reveal">Willkommen</p>
  <h1 class="reveal">Hey, ich bin<br><em>Justin.</em></h1>
  <p class="intro reveal">15-jähriger Programmierer mit Fokus auf Minecraft.</p>
  <button class="btn-primary" onclick="show('contact')">Kontakt</button>
</section>

<section id="about">
  <p class="tag reveal">Über mich</p>
  <h2 class="reveal">Programmieren & Minecraft</h2>
  <p class="intro reveal">Ich entwickle Plugins & Server.</p>
</section>

<section id="contact">
  <p class="tag reveal">Kontakt</p>
  <h2 class="reveal">Schreib mir auf Discord</h2>

  <div class="dc-block reveal">
    <div>
      <strong>Wer_sonst13</strong><br>
      <span style="color:var(--sub);font-size:13px;">Discord</span>
    </div>

    <a class="dc-cta" href="https://discord.com/users/Wer_sonst13" target="_blank">
      DM →
    </a>
  </div>
</section>

<footer>
  <span>Wer_sonst13</span>
  <span>© 2026 Justin</span>
</footer>

</div>

<script>
let current = "home";

function show(id) {
  if (id === current) return;

  const currentEl = document.getElementById(current);
  const nextEl = document.getElementById(id);

  currentEl.classList.remove("active");
  currentEl.classList.add("exit");

  nextEl.classList.add("active");

  setTimeout(() => {
    currentEl.classList.remove("exit");
  }, 500);

  document.querySelectorAll('.nav-links button').forEach(b => b.classList.remove('active'));
  document.getElementById('nav-' + id).classList.add('active');

  current = id;
}

/* Reveal Animation */
const observer = new IntersectionObserver(entries => {
  entries.forEach(e => {
    if (e.isIntersecting) e.target.classList.add('active');
  });
});
document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
</script>

</body>
</html>
